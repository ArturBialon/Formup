name: Build and deploy ASP.Net Core & Angular app to Azure Web App - FormupForwarding

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Konfiguracja Node.js i budowanie Angulara
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies & Build Angular
        run: |
          cd client
          npm ci
          npm run build -- --configuration production

      - name: Copy Angular dist to .NET wwwroot
        run: |
          mkdir -p API/wwwroot
          cp -r client/dist/client/browser/* API/wwwroot/

      # 2. Konfiguracja .NET i publikacja
      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish .NET Application
        run: |
          dotnet publish API/API.csproj -c Release -o ./publish

      # 3. Paczkowanie artefaktu do wdrożenia
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: ./publish

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: app-package
          path: ./publish-downloaded

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_0B2AC46A1A274BD7B929225484B26653 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_6A1B4CAE65B54C349C4AEA59968E7163 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F473128B909C482190402D949BE07D49 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'FormupForwarding'
          package: ./publish-downloaded
