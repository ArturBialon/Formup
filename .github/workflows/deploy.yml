name: Build and Deploy to Azure App Service

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # Krok 1: Pobranie kodu z repozytorium
    - name: Checkout repository
      uses: actions/checkout@v4

    # Krok 2: Konfiguracja Node.js dla Angulara
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: client/package-lock.json

    # Krok 3: Budowanie Angulara
    - name: Install dependencies & Build Angular
      run: |
        cd client
        npm ci
        npm run build -- --configuration production

    # Krok 4: Kopiowanie zkompilowanego Angulara do wwwroot API
    - name: Copy Angular dist to .NET wwwroot
      run: |
        mkdir -p API/wwwroot
        cp -r client/dist/client/browser/* API/wwwroot/

    # Krok 5: Konfiguracja .NET SDK
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    # Krok 6: Publikacja projektu API (.NET)
    - name: Publish .NET Application
      run: |
        dotnet publish API/API.csproj -c Release -o ./publish

    # Krok 7: Deploy do Azure App Service
    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'FormupForwarding'
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: ./publish
