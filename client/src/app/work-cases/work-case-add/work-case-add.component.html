<div class="split-wrapper">
  
  <div class="panel-side side-left panel-card">
    <app-client-list-selector
        (clientSelected)="onClientSelected($event)">
    </app-client-list-selector>
  </div>

  <div class="panel-side side-right panel-card">
    <div class="panel-header">
      <h5 class="text-white mb-0">{{ 'GUI.WORK_CASES.ADD_NEW_BUTTON' | translate }}</h5>
    </div>
    <div class="content-panel">
      @if (!selectedClient()) {
        <div class="alert alert-info text-center shadow-none m-3" role="alert">
          {{"GUI.SELECT_CLIENT" | translate}}
        </div>
      }

      <form [formGroup]="workCaseForm" (ngSubmit)="onSubmit()" class="admin-form" 
            [style.opacity]="selectedClient() && !isSaving() ? '1' : '0.5'" 
            [style.pointer-events]="selectedClient() && !isSaving() ? 'all' : 'none'">
        
        @if (selectedClient()) {
          <div class="mb-4 p-3 rounded d-flex justify-content-between align-items-center" 
              style="background: rgba(0, 55, 128, 0.1); border: 1px solid rgba(255,255,255,0.1);">
            
            <div>
              <strong class="d-block fs-5" 
                      [class.text-success]="isClientActive()" 
                      [class.text-danger]="!isClientActive()">
                {{ selectedClient()?.name }}
              </strong>
              <span class="text-muted small">NIP: {{ selectedClient()?.tax }}</span>
            </div>
            <div class="text-end">
              
            </div>

          </div>
        }

        <div class="form-grid d-flex flex-column gap-3">
          <select class="input form-control shadow-none" formControlName="relation">
            <option value="SE">SE</option>
            <option value="SI">SI</option>
            <option value="NA">NA</option>
          </select>
          <app-input class="field full-width" controlName="amount" label="GUI.WORK_CASES.AMOUNT" type="number" [required]="true"></app-input>
        </div>

        <div class="form-actions d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
          <button type="button" class="btn btn-outline-secondary btn-sm" routerLink="/dashboard/workcases" [disabled]="isSaving()">
            {{ 'GUI.BUTTONS.CANCEL' | translate }}
          </button>
          <button class="btn btn-success btn-sm" type="submit" [disabled]="workCaseForm.invalid || isSaving() || !isClientActive()">
            @if (isSaving()) {
              <span class="spinner-border spinner-border-sm me-2" role="status"></span>
            }
            {{ 'GUI.BUTTONS.CREATE' | translate }}
          </button>
        </div>

      </form>
    </div>
  </div>

</div>
