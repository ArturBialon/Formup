<div class="split-wrapper">
  
  <div class="panel-side side-left">
    
      <div class="panel-card">
            <app-service-contractor-list-selector
                [activeContractor]="selectedContractor()"
                [showAddButton]="true"
                (contractorSelected)="selectContractor($event)"
                (addRequested)="initCreateContractor()">
            </app-service-contractor-list-selector>
        </div>

  </div>


  <div class="panel-side side-right">
    <div class="panel-card">
      <div class="panel-header">
        <span>
          {{ (isCreateMode() ? 'GUI.CONTRACTORS.CREATE_TITLE' : 'GUI.CONTRACTORS.EDIT_TITLE') | translate }}
        </span>
      </div>

      <div class="scrollable-content p-4">
        @if (selectedContractor() || isCreateMode()) {
          <form [formGroup]="contractorForm" (ngSubmit)="onSubmit()" class="admin-form">
            
            <div class="form-grid-2">
              
              <app-input class="field full-width" controlName="name" label="GUI.CONTRACTORS.NAME" [required]="true"></app-input>
              <app-input class="field full-width" controlName="tax" label="GUI.CONTRACTORS.TAX_NIP" [required]="true"></app-input>

              <app-input class="field" controlName="country" label="GUI.CONTRACTORS.COUNTRY" [required]="true"></app-input>
              <app-input class="field" controlName="city" label="GUI.CONTRACTORS.CITY" [required]="true"></app-input>

              <div class="form-grid-2">
                <app-input class="field" controlName="zip" label="GUI.CONTRACTORS.ZIP_CODE" [required]="true"></app-input>
                <app-input class="field" controlName="street" label="GUI.CONTRACTORS.STREET" [required]="true"></app-input>
              </div>
              <div class="form-grid-2">
                <app-input class="field" controlName="houseNumber" label="GUI.CONTRACTORS.HOUSE_NUMBER" [required]="true"></app-input>
                <app-input class="field" controlName="apartmentNumber" label="GUI.CONTRACTORS.APARTMENT_NUMBER"></app-input>
              </div>
              
              <app-input class="field" controlName="email" label="GUI.CONTRACTORS.EMAIL" type="email"></app-input>
              <app-input class="field" controlName="phoneNumber" label="GUI.CONTRACTORS.PHONE"></app-input>

              <div class="field full-width checkbox-field">
                <label class="switch switch-sm">
                  <input type="checkbox" id="isActiveContractor" formControlName="isActive">
                  <span class="slider"></span>
                </label>
                <label for="isActiveContractor" class="checkbox-label">{{ 'GUI.CONTRACTORS.IS_ACTIVE_LABEL' | translate }}</label>
              </div>

            </div>

            <div class="form-actions">
              <button class="button" type="submit" [disabled]="contractorForm.invalid || isSaving()">
                @if (isSaving()) {
                  <span class="spinner-border spinner-border-sm me-2" role="status"></span>
                }
                {{ (isCreateMode() ? 'GUI.BUTTONS.CREATE' : 'GUI.BUTTONS.SAVE_CHANGES') | translate }}
              </button>
            </div>

          </form>
        } @else {
          <div class="empty-state">
            <div>
              <p class="fs-5 mb-1">{{ 'GUI.CONTRACTORS.NO_SELECTED' | translate }}</p>
              <p class="text-sm opacity-50">{{ 'GUI.CONTRACTORS.SELECT_PROMPT' | translate }}</p>
            </div>
          </div>
        }
      </div>
    </div>
  </div>

</div>
